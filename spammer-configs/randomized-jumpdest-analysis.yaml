# Name: Randomized jumpdest analysis (execution-specs#3631)
# Description: CREATE loops over 128 KiB of non-repeating random initcode whose byte alphabet defeats the EVM's jumpdest-analysis branch predictor
# Tags: performance, max-gas, compute, eip7954, eip8037, advanced
# Min_Version: v1.1.5
#
# NOTE: the index generator reads one line per header key and stops at the first
# non-comment line, so the Description above must stay on a single line.
#
# !! NOT PORTABLE AS-IS -- DO NOT UPSTREAM WITHOUT READING THIS !!
# Every address below is a CREATE2 address off spamoor's "well-known" factory, and that
# factory's deployer is derived as sha256(root private key || "create2-factory-deployer")
# (spamoor/walletpool.go:575-599). It is therefore stable across scenario runs on ONE
# spamoor instance and different on every other one. These addresses were computed against
# glamsterdam-devnet-8's instance. On any other deployment the blob deploys elsewhere, the
# driver EXTCODECOPYs an empty account, the initcode becomes 128 KiB of zeros, the jump to
# byte 131,041 lands on a non-JUMPDEST and every child frame halts exceptionally: whole
# blocks burnt while nothing is analysed. Making this a genuine library entry needs the
# source address resolved at runtime (a scenario change), not a config change.
#
# Port of https://github.com/ethereum/execution-specs/pull/3631 to live spammers.
# Two attack variants share one driver; pick either, or run them in sequence:
#
#   A  STOP tail   -- the child falls into an implicit STOP and the account IS created,
#                     exactly as in the PR. Needs prep 3/3, which pre-funds the CREATE
#                     targets so the analysis is not hidden behind NEW_ACCOUNT
#                     (183,600 state gas, ~9x the analysis itself). The attack tx REVERTs,
#                     so the creations roll back and the pre-funded targets are reusable.
#   B  REVERT tail -- the child fails after the full analysis is already done, so the
#                     account-creation charge is refilled and nothing is written to state.
#                     Needs prep 1/3 and 2/3 only.
#
# Measured on geth Amsterdam (evm t8n): 20,286 execution gas per 131,072-byte analysis
# = 6.46 bytes/gas, which is ~1.29 GB of never-before-seen code analysed per 200M block.
# Every address below is CREATE2 off the well-known factory, so they are identical on
# every network. Gas constants are Amsterdam (EIP-8037 CPSB=1530, CREATE_ACCESS=12,000).
#
# Run prep 1/3 and 2/3 to completion first; they are one transaction each.
- scenario: factorydeploytx
  name: "3631 prep 1/3: random-alphabet 64 KiB source (stop_jumpdest_push1)"
  description: "EXTCODECOPY source for the CREATE driver. Deploys to 0x3b47073bd0313c8e775e215cb80d85b7c6990e61."
  config:
    seed: jd3631-blob-stop_jumpdest_push1
    base_fee: 20
    tip_fee: 2
    max_wallets: 1
    max_pending: 1
    refill_amount: 10000000000000000000
    refill_balance: 5000000000000000000
    refill_interval: 600
    total_count: 1
    throughput: 1
    gas_limit: 120000000          # 65536 x 1530 state gas + calldata floor + overhead
    well_known_factory: true
    start_salt: 0
    init_code: ""
- scenario: factorydeploytx
  name: "3631 prep 2/3: CREATE driver"
  description: >-
    Deploys to 0x100dae30856f1b5b689b1a88c8ddf18fc83bfbcf. Arm-independent and tail-independent: the source blob and the
    tail word come from call data, so this one driver serves every alphabet and both
    scenarios A and B. (The funder is deployed by prep 3/3 itself; its address is
    irrelevant because the targets it funds come from call data.)
  config:
    seed: jd3631-driver
    base_fee: 20
    tip_fee: 2
    max_wallets: 1
    max_pending: 1
    refill_amount: 5000000000000000000
    refill_balance: 1000000000000000000
    refill_interval: 600
    total_count: 1
    throughput: 1
    gas_limit: 4000000
    well_known_factory: true
    start_salt: 0
    init_code: "61006c600e60003961006c6000f3620100006000620000006000353c620100006000620100006000353c7f6201ffe1565b5b5b5b5b5b5b5b5b5b5b5b5b5b5b5b5b5b5b5b5b5b5b5b5b5b5b6000526020356201ffe05260005b806020526202000060006000f050600101630000fa005a1161004a5760006000fd"
- scenario: calltx
  name: "3631 prep 3/3: pre-fund 900 CREATE targets"
  description: >-
    One-shot. Sends 1 wei to CREATE(driver, nonce=1..900) so every CREATE in the
    attack skips NEW_ACCOUNT. The attack tx reverts, so these stay unused forever.
  config:
    seed: jd3631-prefund-0
    base_fee: 20
    tip_fee: 2
    max_wallets: 1
    max_pending: 1
    refill_amount: 20000000000000000000
    refill_balance: 10000000000000000000
    refill_interval: 600
    total_count: 1
    throughput: 1
    contract_code: "610029600e6000396100296000f360005b8060051b361461002757600060006000600060018560051b356000f150600101610002565b00"
    deploy_gas_limit: 4000000
    call_data: ""
    gas_limit: 190000000          # 900 x (11,300 exec + 183,600 state) + calldata floor
    amount: 1                     # gwei, covers 900 wei
- scenario: calltx
  name: "3631 attack A: randomized jumpdest analysis, STOP tail (stop_jumpdest_push1)"
  description: >-
    Each tx CREATEs 128 KiB of non-repeating random initcode ~820 times (measured); the initcode
    jumps to its last byte so the whole thing must be analysed, and the counter mixed in at
    offset 32 makes every analysis unique so no client cache can serve it. The child falls
    into an implicit STOP and the account IS created (as in the PR); the driver REVERTs at
    the end so the creations roll back and the pre-funded targets are reusable. 20,286 gas
    per 131,072 bytes = 6.46 bytes/gas.
  config:
    seed: jd3631-attack-a-stop_jumpdest_push1
    base_fee: 20
    tip_fee: 2
    max_wallets: 24
    max_pending: 48
    refill_amount: 5000000000000000000
    refill_balance: 1000000000000000000
    refill_interval: 600
    contract_address: "0x100dae30856f1b5b689b1a88c8ddf18fc83bfbcf"
    call_data: "0x0000000000000000000000003b47073bd0313c8e775e215cb80d85b7c6990e615b5b5b5b5b5b5b5b5b5b5b5b5b5b5b5b5b5b5b5b5b5b5b5b5b5b5b5b5b5b5b5b"
    gas_limit: 16777216           # EIP-7825 execution cap
    # A block takes 200M / 16.73M = 11.96 of these, so 12/slot exactly matches it and any
    # hiccup leaves the block short. Over-provision so the builder always has a queue:
    # the surplus simply waits, and blocks stay saturated.
    throughput: 16
    amount: 0
    rebroadcast: 120
- scenario: calltx
  name: "3631 attack B: randomized jumpdest analysis, REVERT tail (stop_jumpdest_push1)"
  description: >-
    Identical to attack A except the initcode tail is JUMPDEST.. PUSH0 PUSH0 REVERT, so
    every CREATE fails after the full 128 KiB analysis has already been done. The
    account-creation charge is refilled on child error, so no state gas is consumed and
    nothing is written to state. Measured 20,287 gas per 131,072-byte analysis.
  config:
    seed: jd3631-attack-b-stop_jumpdest_push1
    base_fee: 20
    tip_fee: 2
    max_wallets: 24
    max_pending: 48
    refill_amount: 5000000000000000000
    refill_balance: 1000000000000000000
    refill_interval: 600
    contract_address: "0x100dae30856f1b5b689b1a88c8ddf18fc83bfbcf"
    call_data: "0x0000000000000000000000003b47073bd0313c8e775e215cb80d85b7c6990e615b5b5b5b5b5b5b5b5b5b5b5b5b5b5b5b5b5b5b5b5b5b5b5b5b5b5b5b5b5f5ffd"
    # 17,000,000 rather than the 2^24 execution cap: EIP-8037 splits tx.gas into an
    # execution budget capped at TX_MAX_GAS_LIMIT and a state-gas reservoir holding the
    # overflow, so the extra 222,784 becomes reservoir. Each CREATE's NEW_ACCOUNT charge
    # (183,600) is then taken from the reservoir and refilled when the child reverts,
    # instead of spilling into execution gas. Without it the loop cannot finish its last
    # iteration and ends in out-of-gas, burning the limit and telling you nothing.
    # Measured: 16,728,927 used via a clean REVERT (~820 CREATEs) vs an OOG at 16,777,216
    # (~822) -- 0.29% less gas for a receipt that shows whether the loop actually ran.
    gas_limit: 17000000
    throughput: 16                # over-provisioned; see attack A
    amount: 0
    rebroadcast: 120
