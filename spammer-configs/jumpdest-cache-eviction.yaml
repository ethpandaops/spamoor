# Name: Jumpdest code disk-pressure (page-cache eviction)
# Description: Deploys an incompressible per-index-stamped 64 KiB JUMPDEST ring (8 GB) and full-block CALL-sweeps it so every call reads a unique code blob from disk
# Tags: performance, max-gas, compute, eip7954, eip8037, advanced, cache
# Min_Version: v1.1.5
#
# WHY: Jochem's original jumpdest-call ring shares one initcode across all 66,668 contracts ->
# one code hash -> one on-disk blob -> every call is warm and the page cache is never touched.
# This config gives every ring contract its OWN incompressible 64 KiB code (uniform random bytes,
# 4-byte index stamp at runtime offset 0x200, 33-byte JUMPDEST tail ending at 0xFFFF so the
# prologue's jump target is always a valid instruction boundary). 131,072 contracts = 8 GiB of
# unique blobs, far above the ELs' in-process caches (geth's code cache is hard-coded 256 MB).
#
# ONE calltx spammer does everything (fully portable: the driver computes ring addresses itself
# as rlp([ADDRESS, 1+i]), no instance-specific constants):
#   every tx: CALL driver with the 64 KiB random source as calldata, gas_limit 120M.
#     - exec budget (EIP-7825 cap 16.77M): if count < cap (slot 2), the driver stamps the count
#       into the source and CREATEs ring contract #count (state gas (120+65536)*1530 = 100,453,680
#       from the EIP-8037 reservoir = tx.gas - 16.77M = 103.2M). At one fill per block this fills
#       the 8 GB ring in ~131k blocks (~9 days at 6s slots, ~18 days at 12s).
#     - then it sweeps: calls rlp([ADDRESS, 1+i]) with all gas, wrapping at the live count,
#       persisting the resume point in slot 1 BEFORE each call (dirty-slot SSTORE ~100 gas, so the
#       position survives even if the frame dies mid-call). After the cap is reached the fills
#       stop automatically and every tx is a pure sweep.
#
# Measured on geth Amsterdam (evm t8n), all checks green:
#   - fill tx: 117.4M gas total (100.45M state + capped exec)
#   - sweep: cold call to a ring contract = 3000 (cold access) + 12 (prologue+tail exec, analysis
#     itself is CPU/IO, not gas) -> ~5,400 calls per 16.77M exec budget -> ~65k calls/block at
#     12 tx/block -> ~4.3 GB of distinct code demand per block against a 256 MB code cache.
#
# OPTIONAL full-rate sweep (after the driver address is known from the spamoor logs):
#   a second calltx spammer with contract_address = <driver>, call_data empty, gas_limit 16777216,
#   throughput 12: empty calldata skips the fill (calldatasize gate) -> pure sweep at 16.77M/tx.
#
# Fee note: a fill tx moves ~117M gas; at 20 gwei that is ~2.3 ETH per fill (~300k ETH for the
# full ring). Use a low base fee on devnets where blocks are not otherwise full.
#
# Restarting the spammer deploys a FRESH driver (new wallet nonce) with an empty ring; the old
# ring stays in state but is no longer addressed. Do not restart casually.
- scenario: calltx
  name: "jumpdest cache eviction: ring fill + sweep (8 GB incompressible ring)"
  description: >-
    Deploys the ring driver, then every tx sends one fill (stamped CREATE of a unique
    incompressible 64 KiB JUMPDEST contract, 100.45M state gas from the 8037 reservoir) followed
    by a full-exec-budget CALL sweep over the ring with resume-point persistence. After the
    131,072-contract cap (8 GiB) is reached every tx is a pure sweep.
  config:
    seed: jumpdest-cache-eviction-1
    base_fee: 2
    tip_fee: 2
    max_wallets: 4
    max_pending: 8
    refill_amount: 20000000000000000000
    refill_balance: 10000000000000000000
    refill_interval: 600
    total_count: 0
    throughput: 1
    deploy_gas_limit: 1000000
    gas_limit: 120000000
    amount: 0
    random_amount: false
    random_target: false
    contract_code: ""
    contract_file: ""
    contract_address: ""
    contract_args: ""
    contract_addr_path: ""
    call_data: ""
    call_abi: ""
    call_abi_file: ""
    call_fn_name: ""
    call_fn_sig: ""
    call_args: ""
    timeout: ""
    client_group: ""
    deploy_client_group: ""
    log_txs: false
    rebroadcast: 120
